name: Testar e publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Verificar tipos
        run: npm run typecheck
      - name: Rodar testes
        run: npm test
      - name: Montar o site (Next.js, exportação estática)
        run: npm run build
        env:
          NEXT_BASE_PATH: /canteiro-digital
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Desativar o processamento Jekyll
        run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  servidor:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: canteiro
          POSTGRES_PASSWORD: canteiro
          POSTGRES_DB: canteiro_teste
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U canteiro" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Instalar dependências do servidor
        run: npm ci
      - name: Verificar tipos e montar
        run: npm run build
      - name: Testes de integração (API + PostgreSQL)
        run: npm test
        env:
          DATABASE_URL_TESTE: postgres://canteiro:canteiro@localhost:5432/canteiro_teste

  deploy:
    needs: [build, servidor]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
